---
- name: Ensure previous docker packages are absent
  ansible.builtin.package:
    name: '{{ docker_packages_absent | default(docker_packages_absent_default) }}'
    state: absent

- name: Ensure dependencies are present
  ansible.builtin.apt:
    name: '{{ docker_apt_dependencies }}'
    state: present
    update_cache: true

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: '{{ docker_apt_key_directory }}'
    state: directory
    mode: 0755

- name: Ensure Docker GPG key is present
  ansible.builtin.get_url:
    url: '{{ docker_apt_key_url }}'
    dest: '{{ docker_apt_key_directory }}/{{ docker_apt_key_file }}'
    mode: '0644'

- name: Remove Docker repository entry that uses the old apt_key keyring
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/{{ docker_apt_repository_file }}.list
    regexp: 'signed-by={{ docker_apt_key_directory | regex_escape }}/docker\.gpg'
    state: absent

- name: Ensure Docker repository is configured
  ansible.builtin.apt_repository:
    repo: '{{ docker_apt_repository }}'
    filename: '{{ docker_apt_repository_file }}'
    state: present
    update_cache: true

- name: Ensure docker packages are present
  ansible.builtin.apt:
    name: '{{ docker_packages | default(docker_packages_default) }}'
    state: present
    update_cache: true
