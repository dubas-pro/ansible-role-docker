---
name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - defaults/**
      - handlers/**
      - molecule/**
      - tasks/**
      - templates/**
      - vars/**
  schedule:
    - cron: 0 1 * * 3

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v5

      - name: Set up uv.
        uses: astral-sh/setup-uv@v6

      - name: Install lint dependencies.
        run: |
          uv sync --locked
          uv run ansible-galaxy collection install -r molecule/requirements.yml

      - name: Run yamllint.
        run: uv run yamllint .

      - name: Run ansible-lint.
        run: uv run ansible-lint --profile=production

  test:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - ubuntu2204
          - debian12

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v5

      - name: Set up uv.
        uses: astral-sh/setup-uv@v6

      - name: Install test dependencies.
        run: uv sync --locked

      - name: Run Molecule tests.
        run: uv run molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
